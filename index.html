<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101114">
<title>Chest Tracker · Fortnite</title>
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#1a1c21;--line:#30333b;--muted:#a3a7b2;--gold:#f5bd45;--white:#f7f7f8}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#34302a 0,#17181c 42%,var(--bg) 78%);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:flex;justify-content:center}
main{width:min(100%,480px);padding:env(safe-area-inset-top) 20px calc(28px + env(safe-area-inset-bottom));}
header{display:flex;justify-content:space-between;align-items:center;padding:24px 2px 18px;border-bottom:1px solid var(--line)}
.brand{font-size:13px;letter-spacing:2px;font-weight:800}.brand span{color:var(--gold)}.status{font-size:10px;letter-spacing:1px;color:#b8e5c5;border:1px solid #355b42;border-radius:99px;padding:6px 9px}
.hero{margin:24px 0 16px;border:1px solid #51432a;border-radius:20px;overflow:hidden;background:linear-gradient(130deg,#33291a,#1b1b1e 65%);padding:24px 18px;position:relative}
.hero:after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:#e5a62a12;right:-70px;top:-80px}
.eyebrow{font-size:10px;letter-spacing:2px;color:#d5b66e;font-weight:700;text-align:center}
.total{font-size:clamp(56px,17vw,78px);font-weight:850;letter-spacing:-3px;text-align:center;margin:12px 0 0;font-variant-numeric:tabular-nums}
.unit{text-align:center;color:var(--muted);font-size:11px;letter-spacing:3px;margin-top:2px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
button{font:inherit;cursor:pointer;border:0;min-height:58px;border-radius:14px;font-weight:750;font-size:15px}
.add{background:var(--gold);color:#17130b}.subtract{background:#24262d;color:#fff;border:1px solid #454852}
section{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:17px;margin-top:14px}
h2{font-size:11px;letter-spacing:1.6px;color:#d7d9df;margin:0 0 13px}
.manual{display:flex;gap:9px}.manual input{min-width:0;flex:1;background:#111318;border:1px solid #3b3e47;border-radius:11px;padding:0 13px;color:white;font-size:16px;height:48px}
.manual button{min-height:48px;padding:0 15px;background:#343740;color:white;font-size:13px}
.note{font-size:11px;color:var(--muted);line-height:1.5;margin:12px 2px 0}
footer{text-align:center;color:#777d89;font-size:10px;letter-spacing:1px;margin-top:24px}
</style>
</head>
<body>
<main>
<header><div class="brand">CHEST <span>TRACKER</span></div><div class="status">● REGISTRO ACTIVO</div></header>
<div class="hero">
 <div class="eyebrow">TOTAL DE COFRES REGISTRADOS</div>
 <div class="total" id="total" aria-live="polite">1.121</div>
 <div class="unit">COFRES</div>
</div>
<div class="actions">
 <button class="add" id="add">＋ &nbsp; SUMAR 1</button>
 <button class="subtract" id="subtract">− &nbsp; RESTAR 1</button>
</div>
<section>
 <h2>AJUSTE MANUAL</h2>
 <div class="manual"><input id="manual" type="number" min="0" step="1" inputmode="numeric" placeholder="Escribe el total"><button id="save">GUARDAR</button></div>
 <p class="note">El contador se guarda automáticamente en este navegador. Si borras los datos de Safari o cambias de dispositivo, el registro podría perderse.</p>
</section>
<footer>FORTNITE · PERSONAL CHEST RECORD</footer>
</main>
<script>
const KEY='fortnite_chest_tracker_total_v1';
let total=Number(localStorage.getItem(KEY));
if(!Number.isSafeInteger(total)||total<0) total=1121;
const display=document.getElementById('total');
const input=document.getElementById('manual');
function render(){display.textContent=total.toLocaleString('es-ES');localStorage.setItem(KEY,String(total));}
document.getElementById('add').addEventListener('click',()=>{total++;render();});
document.getElementById('subtract').addEventListener('click',()=>{if(total>0){total--;render();}});
document.getElementById('save').addEventListener('click',()=>{const v=input.value.trim();if(v!==''&&Number.isSafeInteger(Number(v))&&Number(v)>=0){total=Number(v);render();input.value='';}else{input.focus();}});
input.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('save').click();});
render();
</script>
</body>
</html>
